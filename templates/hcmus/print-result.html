{% extends "base.html" %}

{% block body %}
<div style="max-width: 640px; margin-top: 12px;">
    <div style="border-left: 5px solid {% if ok %}#2e9e4f{% else %}#c0392b{% endif %};
                background: {% if ok %}#eefaf0{% else %}#fdecea{% endif %};
                padding: 14px 18px; border-radius: 6px;">
        <div style="font-weight: 700; font-size: 1.05em; margin-bottom: 4px;">
            {% if ok %}✅ {{ _('Đã nhận yêu cầu in') }}{% else %}⛔ {{ _('Không in được') }}{% endif %}
        </div>
        <div>{{ message }}</div>
    </div>
    <p style="margin-top: 14px;">
        <a href="{{ url('submission_source', submission.id) }}">← {{ _('Quay lại bài nộp') }}</a>
    </p>
</div>
{% endblock %}
